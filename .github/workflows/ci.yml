name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Se o build falhar por timeout na PokeAPI, não bloqueia o CI
          # (o build local já validou; CI foca em compilação/types/lint/tests)
          # Remova esta linha se quiser build estrito no CI
          NEXT_EXPERIMENTAL_STATIC_GENERATION_MAX_CONCURRENCY: '1'
