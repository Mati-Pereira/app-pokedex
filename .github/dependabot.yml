version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      react:
        patterns:
          - "react*"
          - "@types/react*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      tailwind:
        patterns:
          - "tailwindcss"
          - "daisyui"
          - "autoprefixer"
          - "postcss"
      testing:
        patterns:
          - "react-test-renderer"
          - "@types/node"
    ignore:
      - dependency-type: "direct"
        update-type: "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"